[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live_mt: tests that require a real MikroTik router (set MIKROTIK_TEST_* in .env.test)
    db: database integrity tests (mock MikroTik)
    load: concurrency / load tests (mock MikroTik)
    chaos_live: live concurrent chaos tests (real MikroTik, production-like load)
    live_admin_e2e: full admin panel Telegram E2E on real MikroTik (requires LIVE_ADMIN_ACK_PRODUCTION=1)
    wg_stress_live: WireGuard live stress orchestrator (multi-iface, concurrent, real MikroTik)
    db_backup: pg_dump/pg_restore roundtrip (dedicated BACKUP_TEST_DATABASE_URL, serial only)
    live_admin_rbac: optional live check for DB admin permissions (ADMIN_E2E_DB_ADMIN_TG)
    security: offline white-box security tests (mock MT, real DB)
filterwarnings =
    ignore::DeprecationWarning
